<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch todos with generic and firebase 2</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <h2 class="bg-warning text-center p-2">fetch todos with generic and firebase 2</h2>
    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card mb-1">
                    <div class="card-body">
                        <form action="" id="form">
                            <div class="form-group">
                                <label for="todo">Enter Todo<span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="todo">
                            </div>

                            <button class="btn btn-sm btn-block btn-warning" id="addTodo">Add Todo</button>
                            <button type="button" class="btn btn-sm btn-block btn-success d-none" id="updateTodo">Update
                                Todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <h4 class="text-center text-white">Todo List</h4>
                    <div class="card-body">
                        <ul class="list-group" id="todoList">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <h5>todo</h5>

                                <div>
                                    <button type="button" class="btn btn-sm btn-outline-primary">Edit</button>
                                    <button type="button" class="btn btn-sm btn-outline-danger">Remove</button>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
